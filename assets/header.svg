<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 220" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b12" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#0f0b1e" />
    </linearGradient>

    <!-- Neon Cyan-Violet Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#9d4edd" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7928CA" stop-opacity="0.2" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glowCyan" cx="15%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowViolet" cx="85%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#7928CA" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#7928CA" stop-opacity="0" />
    </radialGradient>

    <!-- Pattern -->
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00F2FE" stroke-width="0.5" stroke-opacity="0.07" />
    </pattern>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 800; letter-spacing: 2px; }
    .subtitle { font-weight: 600; letter-spacing: 3px; }
    .tag { font-size: 11px; font-weight: 700; letter-spacing: 2px; }
    .badge-text { font-size: 11px; font-weight: 600; }
  </style>

  <!-- Base Card -->
  <rect width="850" height="220" rx="16" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="1.5" />

  <!-- Ambient Glows -->
  <rect width="850" height="220" rx="16" fill="url(#glowCyan)" />
  <rect width="850" height="220" rx="16" fill="url(#glowViolet)" />

  <!-- Grid Overlay -->
  <rect width="850" height="220" rx="16" fill="url(#cyberGrid)" />

  <!-- Decorative Corner Accents -->
  <path d="M 25 15 L 15 15 L 15 25" stroke="#00F2FE" stroke-width="2" fill="none" opacity="0.8" />
  <path d="M 825 15 L 835 15 L 835 25" stroke="#9d4edd" stroke-width="2" fill="none" opacity="0.8" />
  <path d="M 15 195 L 15 205 L 25 205" stroke="#00F2FE" stroke-width="2" fill="none" opacity="0.8" />
  <path d="M 835 195 L 835 205 L 825 205" stroke="#9d4edd" stroke-width="2" fill="none" opacity="0.8" />

  <!-- Top Pill: DEVELOP | DESIGN | LEARN | GROW -->
  <g transform="translate(425, 36)">
    <rect x="-135" y="-12" width="270" height="24" rx="12" fill="#00f2fe" fill-opacity="0.08" stroke="#00F2FE" stroke-width="1" stroke-opacity="0.4" />
    <text text-anchor="middle" y="4" fill="#00F2FE" class="mono tag">DEVELOP • DESIGN • LEARN • GROW</text>
  </g>

  <!-- Main Name Title -->
  <text x="425" y="98" text-anchor="middle" fill="url(#neonGrad)" class="sans title" font-size="42" filter="url(#glow)">ROJIN ROY</text>

  <!-- Tagline: BUILDING THE WEB. EXPLORING AI. -->
  <text x="425" y="132" text-anchor="middle" fill="#E6EDF3" class="mono subtitle" font-size="16">BUILDING THE WEB. EXPLORING AI.</text>

  <!-- Tech Focus Badges -->
  <g transform="translate(145, 172)">
    <!-- Badge 1: Web Dev -->
    <g transform="translate(0, 0)">
      <rect width="130" height="26" rx="6" fill="#161b22" stroke="#00F2FE" stroke-width="1" stroke-opacity="0.4" />
      <text x="65" y="17" text-anchor="middle" fill="#00F2FE" class="mono badge-text">&lt;/&gt; WEB DEV</text>
    </g>

    <!-- Badge 2: Python & Django -->
    <g transform="translate(142, 0)">
      <rect width="140" height="26" rx="6" fill="#161b22" stroke="#4FACFE" stroke-width="1" stroke-opacity="0.4" />
      <text x="70" y="17" text-anchor="middle" fill="#4FACFE" class="mono badge-text">PYTHON &amp; DJANGO</text>
    </g>

    <!-- Badge 3: AI & ML -->
    <g transform="translate(294, 0)">
      <rect width="120" height="26" rx="6" fill="#161b22" stroke="#7928CA" stroke-width="1" stroke-opacity="0.4" />
      <text x="60" y="17" text-anchor="middle" fill="#c77dff" class="mono badge-text">AI &amp; ML</text>
    </g>

    <!-- Badge 4: SEO & UI/UX -->
    <g transform="translate(426, 0)">
      <rect width="135" height="26" rx="6" fill="#161b22" stroke="#00F2FE" stroke-width="1" stroke-opacity="0.4" />
      <text x="67" y="17" text-anchor="middle" fill="#00F2FE" class="mono badge-text">SEO &amp; UI/UX</text>
    </g>
  </g>
</svg>
